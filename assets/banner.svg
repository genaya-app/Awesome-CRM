<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <style>
      .title { font: bold 48px sans-serif; fill: white; text-anchor: middle; }
      .subtitle { font: 24px sans-serif; fill: white; text-anchor: middle; opacity: 0.8; }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      .animate-float { animation: float 3s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad)" rx="15" ry="15"/>
  <g class="animate-float">
    <text x="50%" y="45%" class="title">Awesome CRM</text>
    <text x="50%" y="65%" class="subtitle">Top CRM Platforms Ecosystem</text>
  </g>
</svg>